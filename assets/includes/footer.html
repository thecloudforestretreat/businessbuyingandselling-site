<footer class="bbas-footer" role="contentinfo">

    /* Scoped footer styles so footer.html works even before site.css is finalized */

    }
    .bbas-footer a { color: inherit; text-decoration: none; }

    .bbas-footer .bbas-container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px;
    }

    .bbas-footer .bbas-footer-grid {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 24px;
      align-items: start;
    }

    .bbas-footer .bbas-footer-brand {
      display: flex;
      gap: 14px;
      align-items: flex-start;

    .bbas-footer .bbas-footer-logo {

      background: transparent;
    }

    }

      grid-template-columns: 1fr;
      gap: 10px;

      flex-wrap: wrap;

    .bbas-footer .bbas-social a {
      display: inline-flex;
      align-items: center;

      padding: 8px 10px;

      border: 1px solid rgba(229,231,235,0.16);
      background: rgba(255,255,255,0.03);
    }

    .bbas-footer .bbas-social img {
      width: 18px;
      height: 18px;
      display: block;
    }

    .bbas-footer .bbas-footer-bottom {
      border-top: 1px solid rgba(229,231,235,0.14);
      padding: 14px 20px;
      text-align: center;
      font-size: 13px;
      opacity: 0.9;
    }

    @media (max-width: 760px) {
      .bbas-footer .bbas-footer-grid { grid-template-columns: 1fr; }
      .bbas-footer .bbas-footer-nav { grid-auto-flow: row; }
